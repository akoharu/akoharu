<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Asep Koharudin</title>
  <desc id="desc">Full-stack engineer, engineering team lead, and founder of Eyzet.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono, .line, .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
    .line { opacity: 0; animation: show 0.4s ease-out forwards; }
    .l1 { animation-delay: 0.6s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.6s; }
    .prompt { opacity: 0; animation: show 0.3s ease-out 2.1s forwards; }
    .cursor { animation: blink 1.1s steps(1) 2.1s infinite; opacity: 0; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .prompt, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="#faf8f2" stroke="#e1dfd7"/>
  <g>
    <line x1="16" y1="64" x2="1264" y2="64" stroke="#ece8dc" stroke-width="1"/>
    <line x1="16" y1="96" x2="1264" y2="96" stroke="#ece8dc" stroke-width="1"/>
    <line x1="16" y1="128" x2="1264" y2="128" stroke="#ece8dc" stroke-width="1"/>
    <line x1="16" y1="160" x2="1264" y2="160" stroke="#ece8dc" stroke-width="1"/>
    <line x1="16" y1="192" x2="1264" y2="192" stroke="#ece8dc" stroke-width="1"/>
    <line x1="16" y1="224" x2="1264" y2="224" stroke="#ece8dc" stroke-width="1"/>
    <line x1="16" y1="256" x2="1264" y2="256" stroke="#ece8dc" stroke-width="1"/>
    <line x1="16" y1="288" x2="1264" y2="288" stroke="#ece8dc" stroke-width="1"/>
  </g>
  <line x1="96" y1="16" x2="96" y2="304" stroke="#b7382e" stroke-opacity="0.35" stroke-width="2"/>

  <text class="mono" x="136" y="96" fill="#b7382e" font-size="14" letter-spacing="3">DEV DIARY · KOHAR.SPACE</text>
  <text x="132" y="166" fill="#24272c" font-size="66" font-weight="800" letter-spacing="-1.5">Asep Koharudin</text>
  <text x="136" y="212" fill="#50545a" font-size="22">Full-stack engineer · Engineering team lead · Founder of Eyzet</text>
  <text x="136" y="254" fill="#263d60" font-size="18" font-style="italic">I learned to code before AI could code for me.</text>

  <g>
    <rect x="870" y="62" width="350" height="200" rx="12" fill="#24272c" stroke="#24272c"/>
    <circle cx="892" cy="84" r="5" fill="#ee8072"/>
    <circle cx="910" cy="84" r="5" fill="#e8c46a"/>
    <circle cx="928" cy="84" r="5" fill="#8fbf8a"/>
    <text class="mono" x="894" y="124" fill="#9aa0a6">~ $ <tspan fill="#f3f1e9">now</tspan></text>
    <text class="line l1" x="894" y="154"><tspan fill="#ee8072">›</tspan> <tspan fill="#9aa0a6">leading  </tspan><tspan fill="#f3f1e9">a product team</tspan></text>
    <text class="line l2" x="894" y="180"><tspan fill="#ee8072">›</tspan> <tspan fill="#9aa0a6">building </tspan><tspan fill="#f3f1e9">Eyzet</tspan></text>
    <text class="line l3" x="894" y="206"><tspan fill="#ee8072">›</tspan> <tspan fill="#9aa0a6">writing  </tspan><tspan fill="#f3f1e9">kohar.space</tspan></text>
    <text class="prompt" x="894" y="232" fill="#9aa0a6">~ $</text>
    <rect class="cursor" x="934" y="219" width="9" height="17" fill="#ee8072"/>
  </g>
</svg>
